[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xeryon"
version = "0.1.0"
dependencies = [
  "pyserial",
  "hardware_device_base@git+https://github.com/COO-Utilities/hardware_device_base@v1.0.1"
]
description = "This module provides a Python interface to communicate with and control Xeryon precision stages over USB serial or TCP. It supports multi-axis controllers, axis movement, settings management, and safe handling of errors and edge cases."
authors = [
    { name = "Michael Langmayr", email = "langmayr@caltech.edu" }
]
maintainers = [
    {name = "Michael Langmayr", email = "langmayr@caltech.edu"}
]
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
classifiers = [
  "Programming Language :: Python"
]

[project.urls]
# Various URLs related to your project. These links are displayed on PyPI.
# Homepage = "https://example.com"
# Documentation = "https://readthedocs.org"
Repository = "https://github.com/COO-Utils/xeryon"
# "Bug Tracker" = "https://github.com/COO-Utils/xeryon/issues"
# Changelog = "https://github.com/yourusername/your-repo/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest-mock",
    "pytest", 
    "black",
    "flake8"
]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["xeryon"]

[tool.setuptools.package-dir]
xeryon = "."

[tool.pylint.main]
# Xeryon.py is vendored from the manufacturer; see VENDOR_PATCHES.md
ignore = ["Xeryon.py"]
